name: Passing Variables Between jobs
on:
  workflow_dispatch:

jobs:
  producer:
    runs-on: ubuntu-24.04

    outputs:
      foo: ${{ steps.generate-initial.outputs.myvar }}
    steps:
      - name: Generate and export variable
        id: generate-initial
        run: |
          myvar=bar

          # 1) Step output (for job output)
          #this can be passed to other jobs using needs.<job_id>.outputs.<output_name>
          echo "foo=${myvar}" >> "$GITHUB_OUTPUT"

          # 2) Job-scoped environment variable
          #this is set at job level and can be used in subsequent steps of the same job but is not available in other jobs
          echo "FOO=${myvar}" >> "$GITHUB_ENV"

      - name: Inspect values inside producer
        run: |
          echo "FOO (set via GITHUB_ENV):   $FOO"
          echo "foo (step output):          ${{ steps.generate-initial.outputs.myvar }}"

  consumer:
    runs-on: ubuntu-24.04
    needs: producer
    steps:
      - name: Inspect values inside consumer (note FOO is unset)
        run: |
          echo "Value from producer:        ${{ needs.producer.outputs.foo }}"
          echo "FOO in consumer:            ${FOO:-<UNSET>}"
